services:
  - type: web
    name: clipforge
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clipforge-postgres
          property: connectionString
      - key: R2_BUCKET_NAME
        value: my-clips-storage
      - key: STORAGE_DIR
        value: /tmp/clipforge
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      # Music Library (Backblaze B2). Secrets are set in the Render dashboard.
      - key: B2_ENDPOINT
        value: https://s3.ca-east-006.backblazeb2.com
      - key: B2_REGION
        value: ca-east-006
      - key: B2_MUSIC_BUCKET
        value: clipforge-music
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: clipforge-postgres
    databaseName: clipforge
    user: clipforge
